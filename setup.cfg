[flake8]
max-line-length = 79
exclude = .git,__pycache__,.venv,venv,htmlcov,.pytest_cache

[tool:pytest]
testpaths = tests
addopts = --cov=backend --cov-report=term-missing --cov-fail-under=80

[coverage:run]
branch = True
source = backend

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
