name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: PEP8 (flake8)
        run: flake8 backend tests scripts

      - name: Tests and coverage >= 80%
        run: pytest

      # Моки фронта проверяем встроенным раннером node,
      # npm и сторонние пакеты не нужны
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Frontend mock tests (node --test)
        run: node --test tests/frontend/*.test.mjs
