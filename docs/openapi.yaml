openapi: 3.0.3
info:
  title: Трекер диеты API
  version: 0.1.0
  description: >
    Спецификация ведётся вручную, это контракт между бэкендом и фронтом.
    Полный список эндпоинтов в документе архитектуры, раздел RESTful API.
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      summary: Проверка, что сервер и база живы
      responses:
        "200":
          description: Всё работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  db: {type: string, example: ok}
        "503":
          description: База недоступна
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: validation_error}
            message: {type: string}
            field: {type: string, example: height_cm}
